<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Habits</title>
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <link rel="apple-touch-icon" href="/assets/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --text-muted: #64748B;
            --text-sub: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.05);
            --accent-primary: #6366F1;
            --accent-secondary: #8B5CF6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html {
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            display: flex;
            justify-content: center;
            width: 100%;
            min-height: 100dvh;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 20px 16px 140px 16px;
            overflow-x: hidden;
        }

        /* AUTH / LOGIN & REGISTER SCREEN */
        #authScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80vh;
            gap: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border-color);
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-toggle-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
        }

        .auth-message {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            display: none;
            text-align: center;
        }

        .auth-message.error {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .auth-message.success {
            background: rgba(34, 197, 94, 0.15);
            color: #22C55E;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        /* MAIN APP UI */
        header {
            padding: 16px 0 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin: 0;
        }

        .icon-btn-round {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 80px;
            gap: 16px;
            text-align: center;
        }

        .empty-state i {
            font-size: 56px;
            color: var(--text-muted);
        }

        .empty-state p {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .habit-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            position: relative;
        }

        .habit-card {
            background-color: var(--bg-card);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border-color);
            cursor: grab;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease, background-color 0.2s ease;
            width: 100%;
            touch-action: none;
        }

        .habit-card:active {
            cursor: grabbing;
        }

        .habit-card.dragging {
            opacity: 0.85;
            background-color: #2D3748;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            transform: scale(1.02);
            position: relative;
        }

        .bouncy {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
        }

        .bouncy:active {
            transform: scale(0.93) !important;
            opacity: 0.85;
        }

        .habit-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            min-width: 0;
        }

        .habit-name {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .week-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .day-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .day-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .day-label {
            font-size: 9px;
            font-weight: 400;
        }

        .day-label.today {
            font-weight: 700;
        }

        .streak-badge {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 8px;
        }

        .streak-badge i {
            font-size: 10px;
        }

        .check-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: #1E293B;
            border: 1.5px solid #475569;
            color: #475569;
            flex-shrink: 0;
            cursor: pointer;
        }

        .check-btn.completed {
            border-color: transparent;
            color: #0F172A;
        }

        .fab-container {
            position: fixed;
            bottom: 48px;
            bottom: calc(48px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .fab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 999px;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45);
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            overflow: hidden;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            background: var(--bg-main);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            will-change: transform;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-header button {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 20px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            scroll-behavior: smooth;
            touch-action: pan-y;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .form-input {
            padding: 14px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            justify-items: center;
        }

        .color-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.2s ease;
        }

        .color-circle.selected {
            border: 3px solid white;
            transform: scale(1.15);
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            justify-items: center;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-card);
            border: none;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn.selected {
            background: var(--accent-primary);
        }

        .detail-header-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .detail-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .detail-info-text h3 {
            font-size: 22px;
            font-weight: 700;
        }

        .stats-row {
            display: flex;
            gap: 12px;
        }

        .stat-box {
            flex: 1;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .stat-box i {
            font-size: 16px;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .calendar-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .calendar-controls button {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 16px;
            cursor: pointer;
        }

        .month-title {
            font-size: 15px;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .weekday-hdr {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .cal-day-btn {
            height: 38px;
            border-radius: 10px;
            border: none;
            background: var(--bg-main);
            color: white;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .cal-day-btn.disabled {
            opacity: 0.3;
            cursor: default;
        }

        .delete-btn-full {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
        }

        /* POMODORO TIMER STYLES */
        .pomo-tabs {
            display: inline-flex;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            gap: 4px;
            max-width: 100%;
        }

        .pomo-tab-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .pomo-tab-btn.active {
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.35);
        }

        .pomo-circle-wrap {
            position: relative;
            width: 210px;
            height: 210px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pomo-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .pomo-circle-bg {
            fill: none;
            stroke: var(--bg-card);
            stroke-width: 9;
        }

        .pomo-circle-progress {
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-dasharray: 590.62;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.4s linear, stroke 0.3s ease;
        }

        .pomo-time-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .pomo-mode-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-primary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #pomodoroModal .modal-card {
            min-height: 520px;
            height: 530px;
            max-height: 88vh;
        }

        #pomodoroModal .modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 24px 20px;
            gap: 0;
            overflow: visible;
        }

        .pomo-time-display {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin: 4px 0;
        }

        .pomo-round-indicator {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            height: 18px;
            line-height: 18px;
        }

        .pomo-stepper-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 160px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 4px 6px;
            border-radius: 999px;
            box-sizing: border-box;
        }

        .pomo-step-btn {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #ffffff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .pomo-step-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .pomo-duration-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            flex-grow: 1;
            font-variant-numeric: tabular-nums;
        }

        .pomo-presets-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .pomo-preset-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            height: 30px;
            width: 52px;
            min-width: 52px;
            max-width: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            box-sizing: border-box;
            padding: 0;
        }

        .pomo-preset-chip.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--accent-primary);
            color: #ffffff;
        }

        .pomo-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            margin-top: 4px;
        }

        .pomo-ctrl-btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .pomo-ctrl-btn.primary {
            padding: 14px 38px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            color: white;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 700;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
            min-width: 140px;
        }

        .pomo-ctrl-btn.secondary {
            width: 48px;
            height: 48px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            border-radius: 50%;
            font-size: 16px;
        }

        .pomo-ctrl-btn.secondary:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .pomo-active-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22C55E;
            box-shadow: 0 0 6px #22C55E;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- AUTH SCREEN -->
        <div id="authScreen">
            <h1 style="text-align: center; margin-bottom: 8px;">My Habits</h1>
            <div class="auth-card">
                <h2 class="auth-title" id="authTitle">Sign Up</h2>
                
                <div id="authMessage" class="auth-message"></div>

                <div class="form-group">
                    <span class="form-label">EMAIL</span>
                    <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <span class="form-label">PASSWORD</span>
                    <input type="password" id="loginPassword" class="form-input" placeholder="min. 6 characters" required minlength="6">
                </div>
                
                <button class="btn-primary bouncy" id="authSubmitBtn" onclick="handleAuthSubmit()">Create Account</button>
                <button class="auth-toggle-btn" id="authToggleBtn" onclick="toggleAuthMode()">Already have an account? Sign In</button>
            </div>
        </div>

        <!-- MAIN APP -->
        <div id="mainScreen" style="display: none;">
            <header>
                <h1>My Habits</h1>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="icon-btn-round bouncy" id="pomodoroHeaderBtn" onclick="openPomodoroModal()" title="Focus Timer" style="position: relative;">
                        <i class="fa-solid fa-stopwatch"></i>
                        <span id="pomoActiveDot" class="pomo-active-indicator" style="display: none;"></span>
                    </button>
                    <button class="icon-btn-round bouncy" onclick="openAccountModal()" title="Account Settings">
                        <i class="fa-solid fa-user"></i>
                    </button>
                </div>
            </header>

            <div id="habitListContainer" class="habit-list"></div>

            <div class="fab-container">
                <button class="fab-btn bouncy" onclick="openAddModal()">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Habit</span>
                </button>
            </div>
        </div>

    </div>

    <!-- MODAL: CREATE / EDIT HABIT -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <button onclick="closeModal('formModal')">Cancel</button>
                <h2 id="formModalTitle">New Habit</h2>
                <button onclick="saveHabitForm()">Save</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <span class="form-label">NAME</span>
                    <input type="text" id="habitNameInput" class="form-input" placeholder="e.g. Drink 2L water">
                </div>

                <div class="form-group">
                    <span class="form-label">COLOR</span>
                    <div class="color-grid" id="colorGrid"></div>

        function showAuthMessage(text, isError = false) {

        async function handleAuthSubmit() {

            if (!email || !password) {

            }

                showAuthMessage("Password must be at least 6 characters long.", true);
                return;
            }

            if (isRegisterMode) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });

                if (error) {
                    showAuthMessage("Registration failed: " + error.message, true);
                } else if (data.user && data.session === null) {
                    showAuthMessage("Registration successful! Please check your email or disable 'Confirm email' in Supabase Dashboard.", false);
                } else {
                    showAuthMessage("Account created successfully! Loading app...", false);
                    setTimeout(() => showApp(), 1000);
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    showAuthMessage("Login failed: " + error.message, true);

        async function handleLogout() {
            await supabaseClient.auth.signOut();

        function showLogin() {
            document.getElementById("authScreen").style.display = "flex";
            document.getElementById("mainScreen").style.display = "none";

        async function showApp() {
            document.getElementById("authScreen").style.display = "none";
            document.getElementById("mainScreen").style.display = "block";
            await loadDataFromSupabase();
        }

        async function loadDataFromSupabase() {
            const { data: habitsData, error: habitsErr } = await supabaseClient
                .from('habits')
                .select('*')
                .order('position', { ascending: true })
                .order('created_at', { ascending: true });

            if (habitsErr) {
                console.error("Habits Fetch Error:", habitsErr);
            } else if (habitsData) {
                habits = habitsData.map(h => ({
                    id: h.id,
                    name: h.name,
                    icon: h.icon || "drop.fill",
                    colorHex: h.color_hex || "#EE8172",
                    position: h.position || 0,
                    createdAt: h.created_at
                }));
            }

            const { data: compData, error: compErr } = await supabaseClient
                .from('completions')
                .select('*');

            if (compErr) {
                console.error("Completions Fetch Error:", compErr);
            } else if (compData) {
                completions = {};
                compData.forEach(c => {
                    if (!completions[c.habit_id]) {
                        completions[c.habit_id] = new Set();
                    }
                    completions[c.habit_id].add(c.completed_date);
                });
            }

            renderHabitList();
        }

        function formatDateKey(date) {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function isSameDay(d1, d2) {
            return formatDateKey(d1) === formatDateKey(d2);
        }

        function getStartOfDay(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function currentStreak(habitId) {
            const set = completions[habitId];
            if (!set || set.size === 0) return 0;

            let streak = 0;
            let checkDate = getStartOfDay(new Date());

            if (!set.has(formatDateKey(checkDate))) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (set.has(formatDateKey(checkDate))) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            }
            return streak;
        }

        function monthlyCount(habitId) {
            const set = completions[habitId];
            if (!set || set.size === 0) return 0;

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            let count = 0;

            set.forEach(dateStr => {
                const parts = dateStr.split('-');
                if (parseInt(parts[0]) === year && (parseInt(parts[1]) - 1) === month) {
                    count++;
                }
            });

            return count;
        }

        function isCompleted(habitId, date) {
            const set = completions[habitId];
            return set ? set.has(formatDateKey(date)) : false;
        }

        async function toggleCompletion(habitId, date) {
            const today = getStartOfDay(new Date());
            const target = getStartOfDay(date);
            if (target > today) return;

            const dateStr = formatDateKey(date);
            if (!completions[habitId]) {
                completions[habitId] = new Set();
            }

            if (completions[habitId].has(dateStr)) {
                completions[habitId].delete(dateStr);
                renderHabitList();
                await supabaseClient
                    .from('completions')
                    .delete()
                    .eq('habit_id', habitId)
                    .eq('completed_date', dateStr);
            } else {
                completions[habitId].add(dateStr);
                renderHabitList();
                await supabaseClient
                    .from('completions')
                    .insert({ habit_id: habitId, completed_date: dateStr });
            }

            if (selectedHabitForDetail && selectedHabitForDetail.id === habitId) {
                renderDetailContent();
            }
        }

        function renderHabitList() {
            const container = document.getElementById("habitListContainer");
            container.innerHTML = "";

            if (habits.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <p>No habits yet.<br>Create your first one now!</p>
                    </div>
                `;
                return;
            }

            const today = getStartOfDay(new Date());

            habits.forEach((habit, index) => {
                const card = document.createElement("div");
                card.className = "habit-card";
                card.draggable = true;
                card.dataset.index = index;
                card.dataset.id = habit.id;

                card.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    openDetailModal(habit);
                };

                // --- DRAG & DROP DESKTOP ---
                card.addEventListener("dragstart", (e) => {
                    e.dataTransfer.setData("text/plain", index);
                    setTimeout(() => card.classList.add("dragging"), 0);
                });

                card.addEventListener("dragend", () => {
                    card.classList.remove("dragging");
                    saveNewHabitOrder();
                });

                card.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    const draggingCard = container.querySelector(".dragging");
                    if (!draggingCard || draggingCard === card) return;

                    const rect = card.getBoundingClientRect();
                    const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    container.insertBefore(draggingCard, next ? card.nextSibling : card);
                });

                // --- TOUCH / MOBILE DRAG & DROP ---
                let touchStartY = 0;
                let initialCardTop = 0;
                let clone = null;

                card.addEventListener("touchstart", (e) => {
                    if (e.target.closest('button')) return;
                    touchStartY = e.touches[0].clientY;
                    
                    const timer = setTimeout(() => {
                        card.classList.add("dragging");
                        
                        clone = card.cloneNode(true);
                        clone.style.position = "fixed";
                        clone.style.width = card.offsetWidth + "px";
                        clone.style.left = card.getBoundingClientRect().left + "px";
                        clone.style.top = card.getBoundingClientRect().top + "px";
                        clone.style.zIndex = "9999";
                        clone.style.opacity = "0.9";
                        clone.style.pointerEvents = "none";
                        document.body.appendChild(clone);
                    }, 200);

                    card.dataset.touchTimer = timer;
                }, { passive: true });

                card.addEventListener("touchmove", (e) => {
                    if (!card.classList.contains("dragging")) {
                        clearTimeout(card.dataset.touchTimer);
                        return;
                    }
                    e.preventDefault();

                    const currentY = e.touches[0].clientY;
                    const diffY = currentY - touchStartY;
                    if (clone) {
                        clone.style.transform = `translateY(${diffY}px)`;
                    }

                    const elemBelow = document.elementFromPoint(window.innerWidth / 2, currentY);
                    const targetCard = elemBelow ? elemBelow.closest(".habit-card") : null;

                    if (targetCard && targetCard !== card) {
                        const rect = targetCard.getBoundingClientRect();
                        const isAfter = currentY > rect.top + rect.height / 2;
                        if (isAfter) {
                            container.insertBefore(card, targetCard.nextSibling);
                        } else {
                            container.insertBefore(card, targetCard);
                        }
                    }
                }, { passive: false });

                card.addEventListener("touchend", () => {
                    clearTimeout(card.dataset.touchTimer);
                    if (card.classList.contains("dragging")) {
                        card.classList.remove("dragging");
                        if (clone) {
                            clone.remove();
                            clone = null;
                        }
                        updateLocalHabitsOrderFromDOM();
                        saveNewHabitOrder();
                    }
                });

                const faIcon = iconMapping[habit.icon] || "fa-star";
                const streak = currentStreak(habit.id);
                const isDoneToday = isCompleted(habit.id, today);

                let weekDotsHTML = "";
                for (let i = 0; i < 7; i++) {
                    const date = new Date();
                    date.setDate(today.getDate() - 6 + i);
                    const dayStart = getStartOfDay(date);
                    const isDone = isCompleted(habit.id, date);
                    const isToday = isSameDay(date, today);
                    const isFuture = dayStart > today;
                    const weekdayIdx = date.getDay();

                    let circleBg = isDone ? habit.colorHex : (isFuture ? "#1E293B" : "#334155");
                    let circleBorder = isFuture ? "1px solid #334155" : "none";
                    let labelColor = isFuture ? "#334155" : (isToday ? habit.colorHex : "#64748B");

                    weekDotsHTML += `
                        <button class="day-col bouncy" onclick="toggleCompletion('${habit.id}', new Date('${date.toISOString()}'))" ${isFuture ? 'disabled' : ''}>
                            <div class="day-circle" style="background-color: ${circleBg}; border: ${circleBorder}"></div>
                            <span class="day-label ${isToday ? 'today' : ''}" style="color: ${labelColor}">${shortWeekdays[weekdayIdx]}</span>
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="habit-icon-box" style="color: ${habit.colorHex}; background-color: ${habit.colorHex}2E">
                        <i class="fa-solid ${faIcon}"></i>
                    </div>
                    <div class="habit-info">
                        <span class="habit-name">${escapeHtml(habit.name)}</span>
                        <div style="display: flex; align-items: center;">
                            <div class="week-row">${weekDotsHTML}</div>
                            ${streak > 0 ? `
                                <div class="streak-badge" style="color: ${habit.colorHex}">
                                    <i class="fa-solid fa-fire"></i>
                                    <span>${streak}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    <button class="check-btn bouncy ${isDoneToday ? 'completed' : ''}" 
                            style="${isDoneToday ? `background-color: ${habit.colorHex}` : ''}"
                            onclick="toggleCompletion('${habit.id}', new Date())">
                        <i class="fa-solid fa-check"></i>
                    </button>
                `;

                container.appendChild(card);
            });
        }

        function updateLocalHabitsOrderFromDOM() {
            const container = document.getElementById("habitListContainer");
            const cardElements = container.querySelectorAll(".habit-card");
            const newHabitsOrder = [];

            cardElements.forEach((card, newIndex) => {
                const habitId = card.dataset.id;
                const habitObj = habits.find(h => h.id === habitId);
                if (habitObj) {
                    habitObj.position = newIndex;
                    newHabitsOrder.push(habitObj);
                }
            });
            habits = newHabitsOrder;
        }

        async function saveNewHabitOrder() {
            updateLocalHabitsOrderFromDOM();

            for (let habit of habits) {
                await supabaseClient
                    .from('habits')
                    .update({ position: habit.position })
                    .eq('id', habit.id);
            }
        }

            const iconGrid = document.getElementById("iconGrid");

                const faClass = iconMapping[icon] || "fa-star";

                    formIcon = icon;
                    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');

        async function saveHabitForm() {
            const name = document.getElementById("habitNameInput").value.trim();
            if (!name) {
                alert("Please enter a name for the habit.");
                return;
            }

            const payloadIcon = formIcon || availableIcons[0];
            const payloadColor = formColor || vibrantPastels[0];

            if (selectedHabitForEdit) {
                selectedHabitForEdit.name = name;
                selectedHabitForEdit.colorHex = payloadColor;
                selectedHabitForEdit.icon = payloadIcon;

                const { error } = await supabaseClient
                    .from('habits')
                    .update({
                        name: name,
                        color_hex: payloadColor,
                        icon: payloadIcon
                    })
                    .eq('id', selectedHabitForEdit.id);

                if (error) {
                    alert("Update failed: " + error.message);
                    return;
                }
            } else {
                const newPos = habits.length;
                const { data, error } = await supabaseClient
                    .from('habits')
                    .insert([{
                        name: name,
                        icon: payloadIcon,
                        color_hex: payloadColor,
                        position: newPos
                    }])
                    .select();

                if (error) {
                    alert("Saving failed: " + error.message);
                    return;
                }

                if (data && data[0]) {
                    habits.push({
                        id: data[0].id,
                        name: data[0].name,
                        icon: data[0].icon,
                        colorHex: data[0].color_hex,
                        position: data[0].position,
                        createdAt: data[0].created_at
                    });
                }
            }

            renderHabitList();
            closeModal("formModal");
        }

        function openDetailModal(habit) {
            selectedHabitForDetail = habit;
            selectedDetailMonthDate = new Date();
            renderDetailContent();
            openModal("detailModal");
        }

        function renderDetailContent() {
            const habit = selectedHabitForDetail;
            if (!habit) return;

            const content = document.getElementById("detailModalContent");
            const faIcon = iconMapping[habit.icon] || "fa-star";
            const streak = currentStreak(habit.id);
            const mCount = monthlyCount(habit.id);
            const totalCount = completions[habit.id] ? completions[habit.id].size : 0;

            let html = `
                <div class="detail-header-box">
                    <div class="detail-icon-box" style="color: ${habit.colorHex}; background: ${habit.colorHex}2E">
                        <i class="fa-solid ${faIcon}"></i>
                    </div>
                    <div class="detail-info-text">
                        <h3>${escapeHtml(habit.name)}</h3>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-box">
                        <i class="fa-solid fa-fire" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${streak}</span>
                        <span class="stat-lbl">STREAK</span>
                    </div>
                    <div class="stat-box">
                        <i class="fa-solid fa-calendar-check" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${mCount}</span>
                        <span class="stat-lbl">MONTH</span>
                    </div>
                    <div class="stat-box">
                        <i class="fa-solid fa-circle-check" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${totalCount}</span>
                        <span class="stat-lbl">TOTAL</span>
                    </div>
                </div>

                ${renderCalendarHTML(habit)}

                <button class="delete-btn-full bouncy" onclick="deleteHabit('${habit.id}')">
                    <i class="fa-solid fa-trash"></i> Delete Habit
                </button>
            `;

            content.innerHTML = html;
        }

        function changeCalendarMonth(delta) {
            selectedDetailMonthDate.setMonth(selectedDetailMonthDate.getMonth() + delta);
            renderDetailContent();
        }

        function renderCalendarHTML(habit) {
            const year = selectedDetailMonthDate.getFullYear();
            const month = selectedDetailMonthDate.getMonth();
            const monthName = selectedDetailMonthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            let startingDay = firstDay.getDay() - 1;
            if (startingDay === -1) startingDay = 6;

            const totalDays = lastDay.getDate();
            const today = getStartOfDay(new Date());

            let daysHTML = "";
            for (let i = 0; i < startingDay; i++) {
                daysHTML += `<div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const date = new Date(year, month, day);
                const dayStart = getStartOfDay(date);
                const isDone = isCompleted(habit.id, date);
                const isFuture = dayStart > today;

                let bg = "var(--bg-main)";
                let color = "#ffffff";
                if (isDone) {
                    bg = habit.colorHex;
                    color = "#0F172A";
                }

                daysHTML += `
                    <button class="cal-day-btn bouncy ${isFuture ? 'disabled' : ''}" 
                            style="background-color: ${bg}; color: ${color}; font-weight: ${isDone ? '700' : '500'}"
                            onclick="toggleCompletion('${habit.id}', new Date('${date.toISOString()}'))"
                            ${isFuture ? 'disabled' : ''}>
                        ${day}
                    </button>
                `;
            }

            return `
                <div class="calendar-box">
                    <div class="calendar-nav">
                        <span class="month-title">${monthName}</span>
                        <div class="calendar-controls">
                            <button onclick="changeCalendarMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button onclick="changeCalendarMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="calendar-grid">
                        <span class="weekday-hdr">Mon</span>
                        <span class="weekday-hdr">Tue</span>
                        <span class="weekday-hdr">Wed</span>
                        <span class="weekday-hdr">Thu</span>
                        <span class="weekday-hdr">Fri</span>
                        <span class="weekday-hdr">Sat</span>
                        <span class="weekday-hdr">Sun</span>
                        ${daysHTML}
                    </div>
                </div>
            `;
        }

        async function deleteHabit(habitId) {
            if (confirm("Are you sure you want to delete this habit?")) {
                habits = habits.filter(h => h.id !== habitId);
                delete completions[habitId];

                await supabaseClient.from('completions').delete().eq('habit_id', habitId);
                await supabaseClient.from('habits').delete().eq('id', habitId);

                renderHabitList();
                closeModal("detailModal");
            }
        }

        /* ACCOUNT SETTINGS LOGIC */
        async function openAccountModal() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                document.getElementById("updateEmailInput").value = user.email || "";
            }
            document.getElementById("accountMsg").style.display = "none";
            openModal("accountModal");
        }

        async function handleUpdateEmail() {
            const newEmail = document.getElementById("updateEmailInput").value.trim();
            const msgBox = document.getElementById("accountMsg");

            if (!newEmail) return;

            const { error } = await supabaseClient.auth.updateUser({ email: newEmail });

            msgBox.style.display = "block";
            if (error) {
                msgBox.className = "auth-message error";
                msgBox.innerText = "Error: " + error.message;
            } else {
                msgBox.className = "auth-message success";
                msgBox.innerText = "Confirmation link sent to your new email address!";
            }
        }

        async function handleUpdatePassword() {
            const newPassword = document.getElementById("updatePasswordInput").value.trim();
            const msgBox = document.getElementById("accountMsg");

            if (!newPassword || newPassword.length < 6) {
                msgBox.style.display = "block";
                msgBox.className = "auth-message error";
                msgBox.innerText = "Password must be at least 6 characters long.";
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

            msgBox.style.display = "block";
            if (error) {
                msgBox.className = "auth-message error";
                msgBox.innerText = "Error: " + error.message;
            } else {
                msgBox.className = "auth-message success";
                msgBox.innerText = "Password updated successfully!";
                document.getElementById("updatePasswordInput").value = "";
            }
        }

        async function handleDeleteAccount() {
            const confirmation = confirm("Are you sure you want to delete your account data? All your habits and progress will be permanently lost.");
            
            if (!confirmation) return;

            try {
                const habitIds = habits.map(h => h.id);
                if (habitIds.length > 0) {
                    await supabaseClient
                        .from('completions')
                        .delete()
                        .in('habit_id', habitIds);

                    await supabaseClient
                        .from('habits')
                        .delete()
                        .in('id', habitIds);
                }

                habits = [];
                completions = {};

                closeModal("accountModal");
                await handleLogout();

                alert("Your account data has been successfully deleted.");
            } catch (err) {
                alert("An error occurred while deleting your data: " + err.message);
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* ================= POMODORO FOCUS TIMER LOGIC ================= */
        const POMO_CIRCLE_CIRCUMFERENCE = 590.62; // 2 * PI * 94
        
        let pomoDurations = {
            focus: 25,
            shortBreak: 5,
            longBreak: 15
        };

        const POMO_PRESETS = {
            focus: [15, 25, 45, 60],
            shortBreak: [5, 10, 15, 20],
            longBreak: [10, 15, 20, 30]
        };

        let currentPomoMode = 'focus'; // 'focus' | 'shortBreak' | 'longBreak'
        let pomoRound = 1;
        let pomoTimeRemaining = 25 * 60;
        let pomoTotalTime = 25 * 60;
        let pomoIsRunning = false;
        let pomoIntervalId = null;
        let pomoTargetEndTime = null;
        let pomoAudioCtx = null;

        function getPomodoroAudioContext() {
            if (!pomoAudioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    pomoAudioCtx = new AudioContextClass();
                }
            }
            if (pomoAudioCtx && pomoAudioCtx.state === 'suspended') {
                pomoAudioCtx.resume();
            }
            return pomoAudioCtx;
        }

        function playEndChime(isTest = false) {
            try {
                const ctx = getPomodoroAudioContext();
                if (!ctx) return;

                const now = ctx.currentTime;
                // Harmonic 3-note chime: E5 (659Hz) -> G#5 (830Hz) -> B5 (987Hz)
                const notes = [
                    { freq: 659.25, time: 0.00, dur: 0.40 },
                    { freq: 830.61, time: 0.18, dur: 0.45 },
                    { freq: 987.77, time: 0.36, dur: 0.85 }
                ];

                notes.forEach(note => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note.freq, now + note.time);

                    gain.gain.setValueAtTime(0.0001, now + note.time);
                    gain.gain.exponentialRampToValueAtTime(0.35, now + note.time + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + note.time + note.dur);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + note.time);
                    osc.stop(now + note.time + note.dur);
                });
            } catch (e) {
                console.warn("Could not play timer sound:", e);
            }
        }

        function initPomodoroState() {
            try {
                const savedDurations = localStorage.getItem('pomodoro_durations');
                if (savedDurations) {
                    const parsed = JSON.parse(savedDurations);
                    if (parsed.focus && parsed.shortBreak && parsed.longBreak) {
                        pomoDurations = parsed;
                    }
                }
                const savedRound = localStorage.getItem('pomodoro_round');
                if (savedRound) {
                    pomoRound = parseInt(savedRound) || 1;
                }
            } catch (e) {
                console.warn("Failed to load pomodoro config:", e);
            }

            pomoTotalTime = (pomoDurations.focus || 25) * 60;
            pomoTimeRemaining = pomoTotalTime;
            renderPomoPresets();
            updatePomodoroDisplay();
        }

        function openPomodoroModal() {
            getPomodoroAudioContext();
            renderPomoPresets();
            updatePomodoroDisplay();
            openModal('pomodoroModal');
        }

        function switchPomodoroMode(mode) {
            currentPomoMode = mode;
            if (pomoIsRunning) {
                pausePomodoroTimer();
            }

            document.querySelectorAll('.pomo-tab-btn').forEach(btn => btn.classList.remove('active'));
            const tabId = mode === 'focus' ? 'pomoTabFocus' : (mode === 'shortBreak' ? 'pomoTabShort' : 'pomoTabLong');
            const activeBtn = document.getElementById(tabId);
            if (activeBtn) activeBtn.classList.add('active');

            const progressCircle = document.getElementById('pomoProgressCircle');
            const modeBadge = document.getElementById('pomoModeBadge');

            if (mode === 'focus') {
                pomoTotalTime = (pomoDurations.focus || 25) * 60;
                modeBadge.innerText = 'Focus';
                modeBadge.style.color = 'var(--accent-primary)';
                if (progressCircle) progressCircle.style.stroke = 'var(--accent-primary)';
            } else if (mode === 'shortBreak') {
                pomoTotalTime = (pomoDurations.shortBreak || 5) * 60;
                modeBadge.innerText = 'Short Break';
                modeBadge.style.color = '#7BC896';
                if (progressCircle) progressCircle.style.stroke = '#7BC896';
            } else {
                pomoTotalTime = (pomoDurations.longBreak || 15) * 60;
                modeBadge.innerText = 'Long Break';
                modeBadge.style.color = '#6CB8E6';
                if (progressCircle) progressCircle.style.stroke = '#6CB8E6';
            }

            pomoTimeRemaining = pomoTotalTime;
            renderPomoPresets();
            updatePomodoroDisplay();
        }

        function renderPomoPresets() {
            const container = document.getElementById('pomoPresetsRow');
            if (!container) return;
            const presets = POMO_PRESETS[currentPomoMode] || [15, 25, 45, 60];
            const currentMins = pomoDurations[currentPomoMode];

            container.innerHTML = presets.map(mins => `
                <button class="pomo-preset-chip bouncy ${mins === currentMins ? 'active' : ''}" onclick="setPomoMinutes(${mins})">
                    ${mins}m
                </button>
            `).join('');
        }

        function setPomoMinutes(mins) {
            mins = Math.max(1, Math.min(120, mins));
            pomoDurations[currentPomoMode] = mins;
            try {
                localStorage.setItem('pomodoro_durations', JSON.stringify(pomoDurations));
            } catch (e) {}

            pomoTotalTime = mins * 60;
            if (!pomoIsRunning) {
                pomoTimeRemaining = pomoTotalTime;
            }
            renderPomoPresets();
            updatePomodoroDisplay();
        }

        function adjustPomoMinutes(delta) {
            let current = pomoDurations[currentPomoMode];
            let next = current + delta;
            if (next < 1) next = 1;
            if (currentPomoMode === 'focus' && next > 120) next = 120;
            if (currentPomoMode === 'shortBreak' && next > 60) next = 60;
            if (currentPomoMode === 'longBreak' && next > 90) next = 90;

            setPomoMinutes(next);
        }

        function togglePomodoroPlay() {
            getPomodoroAudioContext();
            if (pomoIsRunning) {
                pausePomodoroTimer();
            } else {
                startPomodoroTimer();
            }
        }

        function startPomodoroTimer() {
            if (pomoTimeRemaining <= 0) {
                pomoTimeRemaining = pomoTotalTime;
            }
            pomoIsRunning = true;
            pomoTargetEndTime = Date.now() + (pomoTimeRemaining * 1000);

            document.getElementById('pomoPlayIcon').className = 'fa-solid fa-pause';
            document.getElementById('pomoPlayText').innerText = 'Pause';
            document.getElementById('pomoActiveDot').style.display = 'block';

            if (pomoIntervalId) clearInterval(pomoIntervalId);
            pomoIntervalId = setInterval(pomoTick, 250);
        }

        function pausePomodoroTimer() {
            pomoIsRunning = false;
            if (pomoIntervalId) {
                clearInterval(pomoIntervalId);
                pomoIntervalId = null;
            }
            document.getElementById('pomoPlayIcon').className = 'fa-solid fa-play';
            document.getElementById('pomoPlayText').innerText = 'Start';
            document.getElementById('pomoActiveDot').style.display = 'none';
        }

        function pomoTick() {
            if (!pomoIsRunning || !pomoTargetEndTime) return;

            const now = Date.now();
            const diffSeconds = Math.max(0, Math.round((pomoTargetEndTime - now) / 1000));
            pomoTimeRemaining = diffSeconds;
            updatePomodoroDisplay();

            if (diffSeconds <= 0) {
                pausePomodoroTimer();
                playEndChime();

                // Advance to next session
                if (currentPomoMode === 'focus') {
                    if (pomoRound >= 4) {
                        pomoRound = 1;
                        switchPomodoroMode('longBreak');
                    } else {
                        pomoRound++;
                        switchPomodoroMode('shortBreak');
                    }
                } else {
                    switchPomodoroMode('focus');
                }

                try {
                    localStorage.setItem('pomodoro_round', pomoRound.toString());
                } catch (e) {}

                updatePomodoroDisplay();
            }
        }

        function resetPomodoroTimer() {
            pausePomodoroTimer();
            pomoTimeRemaining = pomoTotalTime;
            updatePomodoroDisplay();
        }

        function updatePomodoroDisplay() {
            const minutes = Math.floor(pomoTimeRemaining / 60);
            const seconds = pomoTimeRemaining % 60;
            const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            const timeDisplay = document.getElementById('pomoTimeDisplay');
            if (timeDisplay) timeDisplay.innerText = timeStr;

            const durationText = document.getElementById('pomoDurationText');
            if (durationText) {
                durationText.innerText = `${pomoDurations[currentPomoMode]} min`;
            }

            const roundIndicator = document.getElementById('pomoRoundIndicator');
            if (roundIndicator) {
                if (currentPomoMode === 'focus') {
                    roundIndicator.innerText = `Round ${pomoRound} of 4`;
                    roundIndicator.style.visibility = 'visible';
                } else {
                    // No subtitle text during breaks as requested, preserved layout space
                    roundIndicator.innerText = '';
                    roundIndicator.style.visibility = 'hidden';
                }
            }

            const progressCircle = document.getElementById('pomoProgressCircle');
            if (progressCircle && pomoTotalTime > 0) {
                const fraction = pomoTimeRemaining / pomoTotalTime;
                const offset = POMO_CIRCLE_CIRCUMFERENCE * (1 - fraction);
                progressCircle.style.strokeDashoffset = offset;
            }
        }

        initPomodoroState();
        initApp();
    </script>
</body>
</html>
