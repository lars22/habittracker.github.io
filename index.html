<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Habits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --text-muted: #64748B;
            --text-sub: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.05);
            --accent-primary: #6366F1;
            --accent-secondary: #8B5CF6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 20px 16px 100px 16px;
        }

        /* AUTH / LOGIN & REGISTER SCREEN */
        #authScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80vh;
            gap: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border-color);
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-toggle-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
        }

        .auth-message {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            display: none;
            text-align: center;
        }

        .auth-message.error {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .auth-message.success {
            background: rgba(34, 197, 94, 0.15);
            color: #22C55E;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        /* MAIN APP UI */
        header {
            padding: 16px 0 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 80px;
            gap: 16px;
            text-align: center;
        }

        .empty-state i {
            font-size: 56px;
            color: var(--text-muted);
        }

        .empty-state p {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .habit-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .habit-card {
            background-color: var(--bg-card);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border-color);
            cursor: grab;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }

        .habit-card:active {
            cursor: grabbing;
        }

        .habit-card.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .bouncy {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
        }

        .bouncy:active {
            transform: scale(0.93) !important;
            opacity: 0.85;
        }

        .habit-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .habit-name {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
        }

        .week-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .day-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .day-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .day-label {
            font-size: 9px;
            font-weight: 400;
        }

        .day-label.today {
            font-weight: 700;
        }

        .streak-badge {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 8px; /* Ganz leicht nach rechts verschoben */
        }

        .streak-badge i {
            font-size: 10px;
        }

        .check-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: #1E293B;
            border: 1.5px solid #475569;
            color: #475569;
            flex-shrink: 0;
            cursor: pointer;
        }

        .check-btn.completed {
            border-color: transparent;
            color: #0F172A;
        }

        .fab-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .fab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 22px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            border-radius: 999px;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(99, 102, 241, 0.4);
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            background: var(--bg-main);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-header button {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .form-input {
            padding: 14px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            justify-items: center;
        }

        .color-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.2s ease;
        }

        .color-circle.selected {
            border: 3px solid white;
            transform: scale(1.15);
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            justify-items: center;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-card);
            border: none;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn.selected {
            background: var(--accent-primary);
        }

        .detail-header-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .detail-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .detail-info-text h3 {
            font-size: 22px;
            font-weight: 700;
        }

        .stats-row {
            display: flex;
            gap: 12px;
        }

        .stat-box {
            flex: 1;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .stat-box i {
            font-size: 16px;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .calendar-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .calendar-controls button {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 16px;
            cursor: pointer;
        }

        .month-title {
            font-size: 15px;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .weekday-hdr {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .cal-day-btn {
            height: 38px;
            border-radius: 10px;
            border: none;
            background: var(--bg-main);
            color: white;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .cal-day-btn.disabled {
            opacity: 0.3;
            cursor: default;
        }

        .delete-btn-full {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- AUTH SCREEN -->
        <div id="authScreen">
            <h1 style="text-align: center; margin-bottom: 8px;">My Habits</h1>
            <div class="auth-card">
                <h2 class="auth-title" id="authTitle">Registrieren</h2>
                
                <div id="authMessage" class="auth-message"></div>

                <div class="form-group">
                    <span class="form-label">E-MAIL</span>
                    <input type="email" id="loginEmail" class="form-input" placeholder="deine@email.de" required>
                </div>
                <div class="form-group">
                    <span class="form-label">PASSWORT</span>
                    <input type="password" id="loginPassword" class="form-input" placeholder="mind. 6 Zeichen" required minlength="6">
                </div>
                
                <button class="btn-primary bouncy" id="authSubmitBtn" onclick="handleAuthSubmit()">Konto erstellen</button>
                <button class="auth-toggle-btn" id="authToggleBtn" onclick="toggleAuthMode()">Bereits ein Konto? Hier anmelden</button>
            </div>
        </div>

        <!-- MAIN APP -->
        <div id="mainScreen" style="display: none;">
            <header>
                <h1>My Habits</h1>
                <button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            </header>

            <div id="habitListContainer" class="habit-list"></div>

            <div class="fab-container">
                <button class="fab-btn bouncy" onclick="openAddModal()">
                    <i class="fa-solid fa-plus"></i>
                    <span>Neues Habit</span>
                </button>
            </div>
        </div>

    </div>

    <!-- MODAL: ERSTELLEN / BEARBEITEN -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <button onclick="closeModal('formModal')">Abbrechen</button>
                <h2 id="formModalTitle">Neues Habit</h2>
                <button onclick="saveHabitForm()">Speichern</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <span class="form-label">NAME</span>
                    <input type="text" id="habitNameInput" class="form-input" placeholder="z. B. 2L Wasser trinken">
                </div>

                <div class="form-group">
                    <span class="form-label">FARBE</span>
                    <div class="color-grid" id="colorGrid"></div>
                </div>

                <div class="form-group">
                    <span class="form-label">ICON</span>
                    <div class="icon-grid" id="iconGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: DETAILS & KALENDER -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <button onclick="closeModal('detailModal')">Schließen</button>
                <h2>Details</h2>
                <button onclick="openEditModal(selectedHabitForDetail)">Bearbeiten</button>
            </div>
            <div class="modal-body" id="detailModalContent"></div>
        </div>
    </div>

    <script>
        // SUPABASE KONFIGURATION
        const SUPABASE_URL = "https://ntkmtlpzjpldpnocuyol.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_EL6J2YmuJGZMhrmeSfOyWQ_wlUvTc2N";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const iconMapping = {
            "drop.fill": "fa-droplet",
            "book.fill": "fa-book-open",
            "figure.run": "fa-person-running",
            "moon.fill": "fa-moon",
            "sun.max.fill": "fa-sun",
            "leaf.fill": "fa-leaf",
            "cup.and.saucer.fill": "fa-mug-hot",
            "dumbbell.fill": "fa-dumbbell",
            "heart.fill": "fa-heart",
            "brain.head.profile": "fa-brain",
            "flame.fill": "fa-fire",
            "pencil.and.outline": "fa-pen",
            "bed.double.fill": "fa-bed",
            "fork.knife": "fa-utensils",
            "pills.fill": "fa-pills",
            "laptopcomputer": "fa-laptop",
            "paintbrush.fill": "fa-paint-brush",
            "target": "fa-bullseye",
            "bicycle": "fa-bicycle",
            "cross.case.fill": "fa-kit-medical",
            "checkmark.seal.fill": "fa-certificate",
            "graduationcap.fill": "fa-graduation-cap",
            "music.note": "fa-music",
            "camera.fill": "fa-camera",
            "cart.fill": "fa-shopping-cart",
            "wallet.pass.fill": "fa-receipt",
            "globe.europe.africa.fill": "fa-globe",
            "tree.fill": "fa-tree",
            "hourglass": "fa-hourglass",
            "bubbles.and.sparkles.fill": "fa-wand-magic-sparkles",
            "figure.walk": "fa-person-walking",
            "figure.mind.and.body": "fa-spa",
            "sparkles": "fa-wand-magic-sparkles",
            "alarm.fill": "fa-bell",
            "calendar": "fa-calendar-days",
            "list.bullet.clipboard.fill": "fa-clipboard-list",
            "lightbulb.fill": "fa-lightbulb",
            "face.smiling.fill": "fa-face-smile",
            "waveform.path.ecg": "fa-heart-pulse",
            "trophy.fill": "fa-trophy"
        };

        const vibrantPastels = [
            "#EE8172", "#F0A25D", "#E1C252", "#B3CE5B",
            "#7BC896", "#6CB8E6", "#DE8CE4", "#ED8CB1"
        ];

        const availableIcons = Object.keys(iconMapping);
        const shortWeekdays = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

        let habits = [];
        let completions = {};
        let selectedHabitForEdit = null;
        let selectedHabitForDetail = null;
        let selectedDetailMonthDate = new Date();

        let formColor = vibrantPastels[0];
        let formIcon = availableIcons[0];
        let isRegisterMode = true;

        async function initApp() {
            setupFormSelectors();

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showApp();
            } else {
                showLogin();
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            hideAuthMessage();
            if (isRegisterMode) {
                document.getElementById("authTitle").innerText = "Registrieren";
                document.getElementById("authSubmitBtn").innerText = "Konto erstellen";
                document.getElementById("authToggleBtn").innerText = "Bereits ein Konto? Hier anmelden";
            } else {
                document.getElementById("authTitle").innerText = "Anmelden";
                document.getElementById("authSubmitBtn").innerText = "Einloggen";
                document.getElementById("authToggleBtn").innerText = "Noch kein Konto? Hier registrieren";
            }
        }

        function showAuthMessage(text, isError = false) {
            const msgBox = document.getElementById("authMessage");
            msgBox.innerText = text;
            msgBox.className = `auth-message ${isError ? 'error' : 'success'}`;
            msgBox.style.display = "block";
        }

        function hideAuthMessage() {
            document.getElementById("authMessage").style.display = "none";
        }

        async function handleAuthSubmit() {
            hideAuthMessage();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            if (!email || !password) {
                showAuthMessage("Bitte E-Mail und Passwort eingeben.", true);
                return;
            }

            if (password.length < 6) {
                showAuthMessage("Das Passwort muss mindestens 6 Zeichen lang sein.", true);
                return;
            }

            if (isRegisterMode) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });

                if (error) {
                    showAuthMessage("Registrierung fehlgeschlagen: " + error.message, true);
                } else if (data.user && data.session === null) {
                    showAuthMessage("Registrierung erfolgreich! Bitte deaktiviere im Supabase Dashboard 'Confirm email', um dich sofort einzuloggen.", false);
                } else {
                    showAuthMessage("Konto erfolgreich erstellt! Lade App...", false);
                    setTimeout(() => showApp(), 1000);
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    showAuthMessage("Login fehlgeschlagen: " + error.message, true);
                } else {
                    showApp();
                }
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            showLogin();
        }

        function showLogin() {
            document.getElementById("authScreen").style.display = "flex";
            document.getElementById("mainScreen").style.display = "none";
        }

        async function showApp() {
            document.getElementById("authScreen").style.display = "none";
            document.getElementById("mainScreen").style.display = "block";
            await loadDataFromSupabase();
        }

        async function loadDataFromSupabase() {
            const { data: habitsData, error: habitsErr } = await supabaseClient
                .from('habits')
                .select('*')
                .order('position', { ascending: true })
                .order('created_at', { ascending: true });

            if (habitsErr) {
                console.error("Habits Fetch Fehler:", habitsErr);
            } else if (habitsData) {
                habits = habitsData.map(h => ({
                    id: h.id,
                    name: h.name,
                    icon: h.icon || "drop.fill",
                    colorHex: h.color_hex || "#EE8172",
                    position: h.position || 0,
                    createdAt: h.created_at
                }));
            }

            const { data: compData, error: compErr } = await supabaseClient
                .from('completions')
                .select('*');

            if (compErr) {
                console.error("Completions Fetch Fehler:", compErr);
            } else if (compData) {
                completions = {};
                compData.forEach(c => {
                    if (!completions[c.habit_id]) {
                        completions[c.habit_id] = new Set();
                    }
                    completions[c.habit_id].add(c.completed_date);
                });
            }

            renderHabitList();
        }

        function formatDateKey(date) {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function isSameDay(d1, d2) {
            return formatDateKey(d1) === formatDateKey(d2);
        }

        function getStartOfDay(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function currentStreak(habitId) {
            const set = completions[habitId];
            if (!set || set.size === 0) return 0;

            let streak = 0;
            let checkDate = getStartOfDay(new Date());

            if (!set.has(formatDateKey(checkDate))) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (set.has(formatDateKey(checkDate))) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            }
            return streak;
        }

        function monthlyCount(habitId) {
            const set = completions[habitId];
            if (!set || set.size === 0) return 0;

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            let count = 0;

            set.forEach(dateStr => {
                const parts = dateStr.split('-');
                if (parseInt(parts[0]) === year && (parseInt(parts[1]) - 1) === month) {
                    count++;
                }
            });

            return count;
        }

        function isCompleted(habitId, date) {
            const set = completions[habitId];
            return set ? set.has(formatDateKey(date)) : false;
        }

        async function toggleCompletion(habitId, date) {
            const today = getStartOfDay(new Date());
            const target = getStartOfDay(date);
            if (target > today) return;

            const dateStr = formatDateKey(date);
            if (!completions[habitId]) {
                completions[habitId] = new Set();
            }

            if (completions[habitId].has(dateStr)) {
                completions[habitId].delete(dateStr);
                renderHabitList();
                await supabaseClient
                    .from('completions')
                    .delete()
                    .eq('habit_id', habitId)
                    .eq('completed_date', dateStr);
            } else {
                completions[habitId].add(dateStr);
                renderHabitList();
                await supabaseClient
                    .from('completions')
                    .insert({ habit_id: habitId, completed_date: dateStr });
            }

            if (selectedHabitForDetail && selectedHabitForDetail.id === habitId) {
                renderDetailContent();
            }
        }

        function renderHabitList() {
            const container = document.getElementById("habitListContainer");
            container.innerHTML = "";

            if (habits.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <p>Keine Habits vorhanden.<br>Erstelle jetzt deinen ersten!</p>
                    </div>
                `;
                return;
            }

            const today = getStartOfDay(new Date());

            habits.forEach((habit, index) => {
                const card = document.createElement("div");
                card.className = "habit-card";
                card.draggable = true;
                card.dataset.index = index;

                card.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    openDetailModal(habit);
                };

                const faIcon = iconMapping[habit.icon] || "fa-star";
                const streak = currentStreak(habit.id);
                const isDoneToday = isCompleted(habit.id, today);

                let weekDotsHTML = "";
                for (let i = 0; i < 7; i++) {
                    const date = new Date();
                    date.setDate(today.getDate() - 6 + i);
                    const dayStart = getStartOfDay(date);
                    const isDone = isCompleted(habit.id, date);
                    const isToday = isSameDay(date, today);
                    const isFuture = dayStart > today;
                    const weekdayIdx = date.getDay();

                    let circleBg = isDone ? habit.colorHex : (isFuture ? "#1E293B" : "#334155");
                    let circleBorder = isFuture ? "1px solid #334155" : "none";
                    let labelColor = isFuture ? "#334155" : (isToday ? habit.colorHex : "#64748B");

                    weekDotsHTML += `
                        <button class="day-col bouncy" onclick="toggleCompletion('${habit.id}', new Date('${date.toISOString()}'))" ${isFuture ? 'disabled' : ''}>
                            <div class="day-circle" style="background-color: ${circleBg}; border: ${circleBorder}"></div>
                            <span class="day-label ${isToday ? 'today' : ''}" style="color: ${labelColor}">${shortWeekdays[weekdayIdx]}</span>
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="habit-icon-box" style="color: ${habit.colorHex}; background-color: ${habit.colorHex}2E">
                        <i class="fa-solid ${faIcon}"></i>
                    </div>
                    <div class="habit-info">
                        <span class="habit-name">${escapeHtml(habit.name)}</span>
                        <div style="display: flex; align-items: center;">
                            <div class="week-row">${weekDotsHTML}</div>
                            ${streak > 0 ? `
                                <div class="streak-badge" style="color: ${habit.colorHex}">
                                    <i class="fa-solid fa-fire"></i>
                                    <span>${streak}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    <button class="check-btn bouncy ${isDoneToday ? 'completed' : ''}" 
                            style="${isDoneToday ? `background-color: ${habit.colorHex}` : ''}"
                            onclick="toggleCompletion('${habit.id}', new Date())">
                        <i class="fa-solid fa-check"></i>
                    </button>
                `;

                container.appendChild(card);
            });
        }

        function setupFormSelectors() {
            const colorGrid = document.getElementById("colorGrid");
            colorGrid.innerHTML = "";
            vibrantPastels.forEach(hex => {
                const circle = document.createElement("div");
                circle.className = `color-circle bouncy ${hex === formColor ? 'selected' : ''}`;
                circle.style.backgroundColor = hex;
                circle.onclick = () => {
                    formColor = hex;
                    document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
                    circle.classList.add('selected');
                };
                colorGrid.appendChild(circle);
            });

            const iconGrid = document.getElementById("iconGrid");
            iconGrid.innerHTML = "";
            availableIcons.forEach(icon => {
                const btn = document.createElement("button");
                btn.className = `icon-btn bouncy ${icon === formIcon ? 'selected' : ''}`;
                const faClass = iconMapping[icon] || "fa-star";
                btn.innerHTML = `<i class="fa-solid ${faClass}"></i>`;
                btn.onclick = () => {
                    formIcon = icon;
                    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                iconGrid.appendChild(btn);
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.add("active");
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove("active");
        }

        function openAddModal() {
            selectedHabitForEdit = null;
            document.getElementById("formModalTitle").innerText = "Neues Habit";
            document.getElementById("habitNameInput").value = "";
            formColor = vibrantPastels[0];
            formIcon = availableIcons[0];
            setupFormSelectors();
            openModal("formModal");
        }

        function openEditModal(habit) {
            closeModal("detailModal");
            selectedHabitForEdit = habit;
            document.getElementById("formModalTitle").innerText = "Habit bearbeiten";
            document.getElementById("habitNameInput").value = habit.name;
            formColor = habit.colorHex || vibrantPastels[0];
            formIcon = habit.icon || availableIcons[0];
            setupFormSelectors();
            openModal("formModal");
        }

        async function saveHabitForm() {
            const name = document.getElementById("habitNameInput").value.trim();
            if (!name) {
                alert("Bitte gib einen Namen für das Habit ein.");
                return;
            }

            const payloadIcon = formIcon || availableIcons[0];
            const payloadColor = formColor || vibrantPastels[0];

            if (selectedHabitForEdit) {
                selectedHabitForEdit.name = name;
                selectedHabitForEdit.colorHex = payloadColor;
                selectedHabitForEdit.icon = payloadIcon;

                const { error } = await supabaseClient
                    .from('habits')
                    .update({
                        name: name,
                        color_hex: payloadColor,
                        icon: payloadIcon
                    })
                    .eq('id', selectedHabitForEdit.id);

                if (error) {
                    alert("Fehler beim Aktualisieren: " + error.message);
                    return;
                }
            } else {
                const newPos = habits.length;
                const { data, error } = await supabaseClient
                    .from('habits')
                    .insert([{
                        name: name,
                        icon: payloadIcon,
                        color_hex: payloadColor,
                        position: newPos
                    }])
                    .select();

                if (error) {
                    alert("Fehler beim Speichern: " + error.message);
                    return;
                }

                if (data && data[0]) {
                    habits.push({
                        id: data[0].id,
                        name: data[0].name,
                        icon: data[0].icon,
                        colorHex: data[0].color_hex,
                        position: data[0].position,
                        createdAt: data[0].created_at
                    });
                }
            }

            renderHabitList();
            closeModal("formModal");
        }

        function openDetailModal(habit) {
            selectedHabitForDetail = habit;
            selectedDetailMonthDate = new Date();
            renderDetailContent();
            openModal("detailModal");
        }

        function renderDetailContent() {
            const habit = selectedHabitForDetail;
            if (!habit) return;

            const content = document.getElementById("detailModalContent");
            const faIcon = iconMapping[habit.icon] || "fa-star";
            const streak = currentStreak(habit.id);
            const mCount = monthlyCount(habit.id);
            const totalCount = completions[habit.id] ? completions[habit.id].size : 0;

            let html = `
                <div class="detail-header-box">
                    <div class="detail-icon-box" style="color: ${habit.colorHex}; background: ${habit.colorHex}2E">
                        <i class="fa-solid ${faIcon}"></i>
                    </div>
                    <div class="detail-info-text">
                        <h3>${escapeHtml(habit.name)}</h3>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-box">
                        <i class="fa-solid fa-fire" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${streak}</span>
                        <span class="stat-lbl">STREAK</span>
                    </div>
                    <div class="stat-box">
                        <i class="fa-solid fa-calendar-check" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${mCount}</span>
                        <span class="stat-lbl">MONAT</span>
                    </div>
                    <div class="stat-box">
                        <i class="fa-solid fa-circle-check" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${totalCount}</span>
                        <span class="stat-lbl">GESAMT</span>
            </div>
                </div>

                ${renderCalendarHTML(habit)}

                <button class="delete-btn-full bouncy" onclick="deleteHabit('${habit.id}')">
                    <i class="fa-solid fa-trash"></i> Habit löschen
                </button>
            `;

            content.innerHTML = html;
        }

        function changeCalendarMonth(delta) {
            selectedDetailMonthDate.setMonth(selectedDetailMonthDate.getMonth() + delta);
            renderDetailContent();
        }

        function renderCalendarHTML(habit) {
            const year = selectedDetailMonthDate.getFullYear();
            const month = selectedDetailMonthDate.getMonth();
            const monthName = selectedDetailMonthDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            let startingDay = firstDay.getDay() - 1;
            if (startingDay === -1) startingDay = 6;

            const totalDays = lastDay.getDate();
            const today = getStartOfDay(new Date());

            let daysHTML = "";
            for (let i = 0; i < startingDay; i++) {
                daysHTML += `<div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const date = new Date(year, month, day);
                const dayStart = getStartOfDay(date);
                const isDone = isCompleted(habit.id, date);
                const isFuture = dayStart > today;

                let bg = "var(--bg-main)";
                let color = "#ffffff";
                if (isDone) {
                    bg = habit.colorHex;
                    color = "#0F172A";
                }

                daysHTML += `
                    <button class="cal-day-btn bouncy ${isFuture ? 'disabled' : ''}" 
                            style="background-color: ${bg}; color: ${color}; font-weight: ${isDone ? '700' : '500'}"
                            onclick="toggleCompletion('${habit.id}', new Date('${date.toISOString()}'))"
                            ${isFuture ? 'disabled' : ''}>
                        ${day}
                    </button>
                `;
            }

            return `
                <div class="calendar-box">
                    <div class="calendar-nav">
                        <span class="month-title">${monthName}</span>
                        <div class="calendar-controls">
                            <button onclick="changeCalendarMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button onclick="changeCalendarMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="calendar-grid">
                        <span class="weekday-hdr">Mo</span>
                        <span class="weekday-hdr">Di</span>
                        <span class="weekday-hdr">Mi</span>
                        <span class="weekday-hdr">Do</span>
                        <span class="weekday-hdr">Fr</span>
                        <span class="weekday-hdr">Sa</span>
                        <span class="weekday-hdr">So</span>
                        ${daysHTML}
                    </div>
                </div>
            `;
        }

        async function deleteHabit(habitId) {
            if (confirm("Möchtest du dieses Habit wirklich löschen?")) {
                habits = habits.filter(h => h.id !== habitId);
                delete completions[habitId];

                await supabaseClient.from('completions').delete().eq('habit_id', habitId);
                await supabaseClient.from('habits').delete().eq('id', habitId);

                renderHabitList();
                closeModal("detailModal");
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        initApp();
    </script>
</body>
</html>
