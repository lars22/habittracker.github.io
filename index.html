<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Habits</title>
<style>
  :root {
    --bg: #0F172A;
    --card: #1E293B;
    --border: #334155;
    --text-dim: #94A3B8;
    --text-faint: #64748B;
    --future: #1E293B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 100px;
  }
  header {
    padding: 24px 20px 12px;
  }
  header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
  }
  .empty {
    text-align: center;
    color: var(--text-dim);
    margin-top: 80px;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
  }
  .list {
    padding: 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
  }
  .icon-box {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-name {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .week-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .day-btn {
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 2px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--border);
  }
  .dot.future { background: var(--future); border: 1px solid var(--border); }
  .day-label {
    font-size: 9px;
    color: var(--text-faint);
  }
  .day-label.future { color: var(--border); }
  .day-label.today { font-weight: 700; }
  .streak {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 12px;
    font-weight: 700;
    margin-left: 4px;
  }
  .done-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid #475569;
    background: #1E293B;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .done-btn:active { transform: scale(0.9); }
  .fab {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #6366F1, #8B5CF6);
    color: #fff;
    border: none;
    padding: 14px 22px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(99,102,241,0.4);
  }
  .fab:active { transform: translateX(-50%) scale(0.95); }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 10;
    align-items: flex-end;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 16px;
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 4px 16px;
  }
  .sheet-header button {
    background: none;
    border: none;
    color: #818CF8;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .sheet-title { font-size: 16px; font-weight: 700; }
  .field-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-faint);
    letter-spacing: 0.03em;
    margin-bottom: 8px;
    display: block;
  }
  .name-input {
    width: 100%;
    background: var(--card);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    font-size: 15px;
    margin-bottom: 22px;
  }
  .swatch-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 22px;
  }
  .swatch {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    margin: 0 auto;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.15s;
  }
  .swatch.selected { border-color: #fff; transform: scale(1.15); }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }
  .icon-cell {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 14px;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    cursor: pointer;
    border: 1.5px solid transparent;
  }
  .icon-cell.selected { border-color: rgba(255,255,255,0.6); }
  .save-btn {
    width: 100%;
    background: linear-gradient(90deg, #6366F1, #8B5CF6);
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    padding: 15px;
    border-radius: 14px;
    margin-top: 8px;
    cursor: pointer;
  }

  /* Detail sheet */
  .stat-row { display: flex; gap: 10px; margin: 16px 0; }
  .stat-box {
    flex: 1;
    background: var(--card);
    border-radius: 16px;
    padding: 14px 6px;
    text-align: center;
  }
  .stat-box .val { font-size: 20px; font-weight: 800; margin: 4px 0; }
  .stat-box .lbl { font-size: 11px; color: var(--text-dim); font-weight: 500; }
  .cal-wrap { background: var(--card); border-radius: 20px; padding: 16px; margin-top: 4px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .cal-head .nav-btn { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 4px 10px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-faint); }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid transparent;
  }
  .cal-day.today { border-color: var(--accent, #fff); background: var(--border); }
  .cal-day.future { opacity: 0.3; cursor: default; }
  .header-box {
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }
  .delete-btn {
    width: 100%;
    background: none;
    border: 1px solid #ED8CB1;
    color: #ED8CB1;
    font-size: 15px;
    font-weight: 600;
    padding: 13px;
    border-radius: 14px;
    margin-top: 24px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header><h1>My Habits</h1></header>
<div id="listWrap"></div>

<button class="fab" onclick="openForm()">
  <span>＋</span><span>New Habit</span>
</button>

<!-- Form Sheet -->
<div class="overlay" id="formOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <button onclick="closeForm()">Cancel</button>
      <span class="sheet-title" id="formTitle">New Habit</span>
      <button onclick="saveHabit()">Save</button>
    </div>
    <label class="field-label">NAME</label>
    <input class="name-input" id="nameInput" placeholder="e.g. Drink 2L Water">

    <label class="field-label">COLOR</label>
    <div class="swatch-grid" id="swatchGrid"></div>

    <label class="field-label">ICON</label>
    <div class="icon-grid" id="iconGrid"></div>
  </div>
</div>

<!-- Detail Sheet -->
<div class="overlay" id="detailOverlay">
  <div class="sheet" id="detailSheet"></div>
</div>

<script>
// Neue 8er-Farbpalette
const PALETTE = [
  "#EE8172", // Koralle / Rot
  "#F0A25D", // Orange
  "#E1C252", // Gelb
  "#B3CE5B", // Limettengrün
  "#7BC896", // Mintgrün
  "#6CB8E6", // Hellblau
  "#DE8CE4", // Flieder / Violett
  "#ED8CB1"  // Rosa
];
const ICONS = ["💧","📖","🏃","🌙","☀️","🍃","☕","🏋️","❤️","🧠","🔥","✏️","🛌","🍽️","💊","💻","🎨","🎯","🚴","➕","✅","🎓","🎵","📷","🛒","👛","🌍","🌳","⏳","🫧","🚶","🧘","✨","⏰","📅","📋","💡","😊","📈","🏆"];

// In-Memory State (kein localStorage im Artifact-Kontext)
let habits = [
  { id: "1", name: "Drink Water", icon: "💧", color: "#6CB8E6", createdAt: new Date() },
  { id: "2", name: "Read Book", icon: "📖", color: "#DE8CE4", createdAt: new Date() },
  { id: "3", name: "Workout", icon: "🏃", color: "#7BC896", createdAt: new Date() }
];
let completions = {}; // { habitId: Set of "yyyy-mm-dd" }
let editingHabitId = null;
let formColor = PALETTE[0];
let formIcon = ICONS[0];
let detailMonth = new Date();
let currentDetailId = null;

function dateKey(d) {
  return d.toISOString().slice(0, 10);
}
function isCompleted(habitId, d) {
  return completions[habitId]?.has(dateKey(d)) ?? false;
}
function toggle(habitId, d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  if (dd > today) return;
  if (!completions[habitId]) completions[habitId] = new Set();
  const k = dateKey(d);
  completions[habitId].has(k) ? completions[habitId].delete(k) : completions[habitId].add(k);
  render();
}
function currentStreak(habitId) {
  const set = completions[habitId];
  if (!set || set.size === 0) return 0;
  let streak = 0;
  let check = new Date(); check.setHours(0,0,0,0);
  if (!set.has(dateKey(check))) check.setDate(check.getDate() - 1);
  while (set.has(dateKey(check))) {
    streak++;
    check.setDate(check.getDate() - 1);
  }
  return streak;
}
function monthCount(habitId, refDate) {
  const set = completions[habitId];
  if (!set) return 0;
  let count = 0;
  set.forEach(k => {
    const d = new Date(k);
    if (d.getFullYear() === refDate.getFullYear() && d.getMonth() === refDate.getMonth()) count++;
  });
  return count;
}

function render() {
  const wrap = document.getElementById("listWrap");
  if (habits.length === 0) {
    wrap.innerHTML = `<div class="empty">No habits found.<br>Start building your routine!</div>`;
    return;
  }
  const shortWd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const today = new Date(); today.setHours(0,0,0,0);

  wrap.innerHTML = `<div class="list">` + habits.map(h => {
    let daysHtml = "";
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
      const done = isCompleted(h.id, d);
      const isToday = d.getTime() === today.getTime();
      const isFuture = d > today;
      const wd = shortWd[d.getDay()];
      daysHtml += `
        <button class="day-btn" onclick="event.stopPropagation(); toggle('${h.id}', new Date(${d.getTime()}))" ${isFuture ? "disabled" : ""}>
          <div class="dot ${isFuture ? "future" : ""}" style="${done ? `background:${h.color}` : ""}"></div>
          <div class="day-label ${isFuture ? "future" : ""} ${isToday ? "today" : ""}" style="${isToday && !isFuture ? `color:${h.color}` : ""}">${wd}</div>
        </button>`;
    }
    const streak = currentStreak(h.id);
    const streakHtml = streak > 0 ? `<div class="streak" style="color:${h.color}">🔥${streak}</div>` : "";
    const doneToday = isCompleted(h.id, today);

    return `
      <div class="card" onclick="openDetail('${h.id}')">
        <div class="icon-box" style="background:${h.color}2e; color:${h.color}">${h.icon}</div>
        <div class="card-body">
          <div class="card-name">${h.name}</div>
          <div class="week-row">${daysHtml}${streakHtml}</div>
        </div>
        <button class="done-btn" style="${doneToday ? `background:${h.color};border-color:${h.color};color:#0F172A` : ""}"
          onclick="event.stopPropagation(); toggle('${h.id}', new Date(${today.getTime()}))">✓</button>
      </div>`;
  }).join("") + `</div>`;
}

// ---- Form ----
function openForm(habit) {
  editingHabitId = habit ? habit.id : null;
  document.getElementById("formTitle").textContent = habit ? "Edit Habit" : "New Habit";
  document.getElementById("nameInput").value = habit ? habit.name : "";
  formColor = habit ? habit.color : PALETTE[0];
  formIcon = habit ? habit.icon : ICONS[0];

  document.getElementById("swatchGrid").innerHTML = PALETTE.map(c => `
    <div class="swatch ${c === formColor ? "selected" : ""}" style="background:${c}"
      onclick="selectColor('${c}')"></div>`).join("");

  document.getElementById("iconGrid").innerHTML = ICONS.map(ic => `
    <div class="icon-cell ${ic === formIcon ? "selected" : ""}" style="${ic === formIcon ? `background:${formColor};color:#0F172A` : ""}"
      onclick="selectIcon('${ic}')">${ic}</div>`).join("");

  document.getElementById("formOverlay").classList.add("open");
}
function selectColor(c) {
  formColor = c;
  openFormRefresh();
}
function selectIcon(ic) {
  formIcon = ic;
  openFormRefresh();
}
function openFormRefresh() {
  document.getElementById("swatchGrid").innerHTML = PALETTE.map(c => `
    <div class="swatch ${c === formColor ? "selected" : ""}" style="background:${c}"
      onclick="selectColor('${c}')"></div>`).join("");
  document.getElementById("iconGrid").innerHTML = ICONS.map(ic => `
    <div class="icon-cell ${ic === formIcon ? "selected" : ""}" style="${ic === formIcon ? `background:${formColor};color:#0F172A` : ""}"
      onclick="selectIcon('${ic}')">${ic}</div>`).join("");
}
function closeForm() {
  document.getElementById("formOverlay").classList.remove("open");
}
function saveHabit() {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) return;
  if (editingHabitId) {
    const h = habits.find(h => h.id === editingHabitId);
    h.name = name; h.color = formColor; h.icon = formIcon;
  } else {
    habits.push({ id: Date.now().toString(), name, icon: formIcon, color: formColor, createdAt: new Date() });
  }
  closeForm();
  render();
}

// ---- Detail ----
function openDetail(id) {
  currentDetailId = id;
  detailMonth = new Date();
  renderDetail();
  document.getElementById("detailOverlay").classList.add("open");
}
function closeDetail() {
  document.getElementById("detailOverlay").classList.remove("open");
}
function changeMonth(delta) {
  detailMonth.setMonth(detailMonth.getMonth() + delta);
  renderDetail();
}
function deleteHabit() {
  habits = habits.filter(h => h.id !== currentDetailId);
  delete completions[currentDetailId];
  closeDetail();
  render();
}
function renderDetail() {
  const h = habits.find(h => h.id === currentDetailId);
  if (!h) return;
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const today = new Date(); today.setHours(0,0,0,0);

  // calendar grid
  const firstDay = new Date(detailMonth.getFullYear(), detailMonth.getMonth(), 1);
  const startWd = (firstDay.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(detailMonth.getFullYear(), detailMonth.getMonth() + 1, 0).getDate();
  let cells = "";
  for (let i = 0; i < startWd; i++) cells += `<div></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(detailMonth.getFullYear(), detailMonth.getMonth(), day);
    const isToday = d.getTime() === today.getTime();
    const isFuture = d > today;
    const done = isCompleted(h.id, d);
    cells += `
      <div class="cal-day ${isToday ? "today" : ""} ${isFuture ? "future" : ""}"
        style="${done ? `background:${h.color};color:#0F172A;font-weight:700` : ""}; ${isToday ? `border-color:${h.color}` : ""}"
        onclick="${isFuture ? "" : `toggle('${h.id}', new Date(${d.getTime()})); renderDetail();`}">${day}</div>`;
  }

  document.getElementById("detailSheet").innerHTML = `
    <div class="sheet-header">
      <button onclick="closeDetail()">Close</button>
      <span class="sheet-title">Details</span>
      <button onclick="openForm(habits.find(x=>x.id==='${h.id}')); closeDetail();">✎ Edit</button>
    </div>
    <div class="header-box">
      <div class="icon-box" style="background:${h.color}33; color:${h.color}; font-size:24px">${h.icon}</div>
      <div>
        <div style="font-size:22px;font-weight:800">${h.name}</div>
        <div style="font-size:13px;color:var(--text-faint);margin-top:4px">Created on ${h.createdAt.toLocaleDateString()}</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div style="color:${h.color}">🔥</div><div class="val">${currentStreak(h.id)}</div><div class="lbl">Day Streak</div></div>
      <div class="stat-box"><div style="color:${h.color}">📅</div><div class="val">${monthCount(h.id, detailMonth)}</div><div class="lbl">This Month</div></div>
      <div class="stat-box"><div style="color:${h.color}">✅</div><div class="val">${completions[h.id]?.size ?? 0}</div><div class="lbl">Total Done</div></div>
    </div>
    <div class="cal-wrap">
      <div class="cal-head">
        <span style="font-weight:700;font-size:18px">Calendar</span>
        <div style="display:flex;align-items:center;gap:12px">
          <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
          <span style="font-weight:600;font-size:15px">${monthNames[detailMonth.getMonth()]} ${detailMonth.getFullYear()}</span>
          <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w => `<div class="cal-wd">${w}</div>`).join("")}
        ${cells}
      </div>
    </div>
    <button class="delete-btn" onclick="deleteHabit()">Delete Habit</button>
  `;
}

render();
</script>
</body>
</html>
