<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Habits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --text-muted: #64748B;
            --text-sub: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.05);
            --accent-primary: #6366F1;
            --accent-secondary: #8B5CF6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 20px 16px 100px 16px;
        }

        header {
            padding: 16px 0 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-status-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 80px;
            gap: 16px;
            text-align: center;
        }

        .empty-state i {
            font-size: 56px;
            color: var(--text-muted);
        }

        .empty-state p {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .habit-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .habit-card {
            background-color: var(--bg-card);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }

        .bouncy {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
        }

        .bouncy:active {
            transform: scale(0.93) !important;
            opacity: 0.85;
        }

        .habit-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .habit-name {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
        }

        .week-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .day-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .day-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .day-label {
            font-size: 9px;
            font-weight: 400;
        }

        .day-label.today {
            font-weight: 700;
        }

        .streak-badge {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 4px;
        }

        .streak-badge i {
            font-size: 10px;
        }

        .check-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: none;
            cursor: pointer;
            background: #1E293B;
            border: 1.5px solid #475569;
            color: #475569;
            flex-shrink: 0;
        }

        .check-btn.completed {
            border-color: transparent;
            color: #0F172A;
        }

        .fab-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .fab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 22px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            border-radius: 999px;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(99, 102, 241, 0.4);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            background: var(--bg-main);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-header button {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .form-input {
            padding: 14px;
            background-color: var(--bg-card);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            justify-items: center;
        }

        .color-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.2s ease;
        }

        .color-circle.selected {
            border: 3px solid white;
            transform: scale(1.15);
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            justify-items: center;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-card);
            border: none;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn.selected {
            background: var(--accent-primary);
        }

        .detail-header-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .detail-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .detail-info-text h3 {
            font-size: 22px;
            font-weight: 700;
        }

        .detail-info-text p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .stats-row {
            display: flex;
            gap: 12px;
        }

        .stat-box {
            flex: 1;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .stat-box i {
            font-size: 16px;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .calendar-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-nav h4 {
            font-size: 18px;
            font-weight: 700;
        }

        .calendar-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .calendar-controls button {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 16px;
            cursor: pointer;
        }

        .month-title {
            font-size: 15px;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .weekday-hdr {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .cal-day-btn {
            height: 38px;
            border-radius: 10px;
            border: none;
            background: var(--bg-main);
            color: white;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .cal-day-btn.disabled {
            opacity: 0.3;
            cursor: default;
        }

        .delete-btn-full {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
        }

        .auth-btn-full {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .auth-error {
            color: #EF4444;
            font-size: 13px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>My Habits</h1>
            <button id="authBtn" class="auth-status-btn" onclick="handleAuthClick()">Login</button>
        </header>

        <div id="habitListContainer" class="habit-list"></div>

        <div class="fab-container">
            <button class="fab-btn bouncy" onclick="openAddModal()">
                <i class="fa-solid fa-plus"></i>
                <span>New Habit</span>
            </button>
        </div>
    </div>

    <!-- AUTH MODAL -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <button onclick="closeModal('authModal')">Abbrechen</button>
                <h2>Account Login</h2>
                <div></div>
            </div>
            <div class="modal-body">
                <div id="authErrorMsg" class="auth-error"></div>
                <div class="form-group">
                    <span class="form-label">E-MAIL</span>
                    <input type="email" id="authEmail" class="form-input" placeholder="deine@email.de">
                </div>
                <div class="form-group">
                    <span class="form-label">PASSWORT</span>
                    <input type="password" id="authPassword" class="form-input" placeholder="••••••••">
                </div>
                <button class="auth-btn-full bouncy" onclick="login()">Anmelden</button>
                <button class="delete-btn-full bouncy" style="background: rgba(255, 255, 255, 0.05); color: #fff;" onclick="signUp()">Neues Konto erstellen</button>
            </div>
        </div>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <button onclick="closeModal('formModal')">Abbrechen</button>
                <h2 id="formModalTitle">New Habit</h2>
                <button onclick="saveHabitForm()">Speichern</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <span class="form-label">NAME</span>
                    <input type="text" id="habitNameInput" class="form-input" placeholder="z. B. 2L Wasser trinken">
                </div>

                <div class="form-group">
                    <span class="form-label">FARBE</span>
                    <div class="color-grid" id="colorGrid"></div>
                </div>

                <div class="form-group">
                    <span class="form-label">ICON</span>
                    <div class="icon-grid" id="iconGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <button onclick="closeModal('detailModal')">Schließen</button>
                <h2>Details</h2>
                <button onclick="openEditModal(selectedHabitForDetail)">Bearbeiten</button>
            </div>
            <div class="modal-body" id="detailModalContent"></div>
        </div>
    </div>

    <script>
        // SUPABASE KONFIGURATION
        const SUPABASE_URL = "https://rfcclktwfzyihcjjpiya.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_5URf8UCOBdWpVxcA0VSAbw_2NO4jzan";
        
        // Verwende den Variablennamen supabaseClient, um Konflikte zu vermeiden
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const iconMapping = {
            "drop.fill": "fa-droplet",
            "book.fill": "fa-book",
            "figure.run": "fa-person-running",
            "moon.fill": "fa-moon",
            "sun.max.fill": "fa-sun",
            "leaf.fill": "fa-leaf",
            "cup.and.saucer.fill": "fa-mug-hot",
            "dumbbell.fill": "fa-dumbbell",
            "heart.fill": "fa-heart",
            "brain.head.profile": "fa-brain",
            "flame.fill": "fa-fire",
            "pencil.and.outline": "fa-pen",
            "bed.double.fill": "fa-bed",
            "fork.knife": "fa-utensils",
            "pills.fill": "fa-pills",
            "laptopcomputer": "fa-laptop",
            "paintbrush.fill": "fa-paint-brush",
            "target": "fa-bullseye",
            "bicycle": "fa-bicycle",
            "cross.case.fill": "fa-kit-medical",
            "checkmark.seal.fill": "fa-certificate",
            "graduationcap.fill": "fa-graduation-cap",
            "music.note": "fa-music",
            "camera.fill": "fa-camera",
            "cart.fill": "fa-shopping-cart",
            "wallet.pass.fill": "fa-wallet",
            "globe.europe.africa.fill": "fa-globe",
            "tree.fill": "fa-tree",
            "hourglass": "fa-hourglass",
            "bubbles.and.sparkles.fill": "fa-wand-magic-sparkles",
            "figure.walk": "fa-person-walking",
            "figure.mind.and.body": "fa-spa",
            "sparkles": "fa-sparkles",
            "alarm.fill": "fa-bell",
            "calendar": "fa-calendar-days",
            "list.bullet.clipboard.fill": "fa-clipboard-list",
            "lightbulb.fill": "fa-lightbulb",
            "face.smiling.fill": "fa-face-smile",
            "waveform.path.ecg": "fa-heart-pulse",
            "trophy.fill": "fa-trophy"
        };

        const vibrantPastels = [
            "#EE8172", "#F0A25D", "#E1C252", "#B3CE5B",
            "#7BC896", "#6CB8E6", "#DE8CE4", "#ED8CB1"
        ];

        const availableIcons = Object.keys(iconMapping);
        const shortWeekdays = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

        let habits = [];
        let completions = {};
        let currentUser = null;
        let selectedHabitForEdit = null;
        let selectedHabitForDetail = null;
        let selectedDetailMonthDate = new Date();

        let formColor = "#EE8172";
        let formIcon = "drop.fill";

        async function initApp() {
            setupFormSelectors();

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                updateUserSession(session?.user || null);

                supabaseClient.auth.onAuthStateChange((_event, session) => {
                    updateUserSession(session?.user || null);
                });
            } catch (e) {
                console.error("Supabase Init Fehler:", e);
            }
        }

        function updateUserSession(user) {
            currentUser = user;
            const authBtn = document.getElementById("authBtn");
            if (user) {
                authBtn.innerText = "Logout";
                loadDataFromSupabase();
            } else {
                authBtn.innerText = "Login";
                habits = [];
                completions = {};
                renderHabitList();
            }
        }

        async function loadDataFromSupabase() {
            if (!currentUser) return;

            const { data: habitsData, error: habitsErr } = await supabaseClient
                .from('habits')
                .select('*')
                .order('created_at', { ascending: true });

            if (habitsErr) {
                console.error("Habits Fetch Fehler:", habitsErr);
                return;
            }

            habits = habitsData.map(h => ({
                id: h.id,
                name: h.name,
                icon: h.icon,
                colorHex: h.color_hex,
                createdAt: h.created_at
            }));

            const { data: compData, error: compErr } = await supabaseClient
                .from('completions')
                .select('*');

            if (compErr) {
                console.error("Completions Fetch Fehler:", compErr);
                return;
            }

            completions = {};
            compData.forEach(c => {
                if (!completions[c.habit_id]) {
                    completions[c.habit_id] = new Set();
                }
                completions[c.habit_id].add(c.completed_date);
            });

            renderHabitList();
        }

        function formatDateKey(date) {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function isSameDay(d1, d2) {
            return formatDateKey(d1) === formatDateKey(d2);
        }

        function getStartOfDay(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function currentStreak(habitId) {
            const set = completions[habitId];
            if (!set || set.size === 0) return 0;

            let streak = 0;
            let checkDate = getStartOfDay(new Date());

            if (!set.has(formatDateKey(checkDate))) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (set.has(formatDateKey(checkDate))) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            }
            return streak;
        }

        function isCompleted(habitId, date) {
            const set = completions[habitId];
            return set ? set.has(formatDateKey(date)) : false;
        }

        async function toggleCompletion(habitId, date) {
            if (!currentUser) {
                openModal("authModal");
                return;
            }

            const today = getStartOfDay(new Date());
            const target = getStartOfDay(date);
            if (target > today) return;

            const dateStr = formatDateKey(date);
            if (!completions[habitId]) {
                completions[habitId] = new Set();
            }

            if (completions[habitId].has(dateStr)) {
                completions[habitId].delete(dateStr);
                renderHabitList();
                await supabaseClient
                    .from('completions')
                    .delete()
                    .eq('habit_id', habitId)
                    .eq('completed_date', dateStr);
            } else {
                completions[habitId].add(dateStr);
                renderHabitList();
                await supabaseClient
                    .from('completions')
                    .insert({ habit_id: habitId, completed_date: dateStr });
            }

            if (selectedHabitForDetail && selectedHabitForDetail.id === habitId) {
                renderDetailContent();
            }
        }

        function monthCount(habitId, targetDate) {
            const set = completions[habitId];
            if (!set) return 0;
            const year = targetDate.getFullYear();
            const month = targetDate.getMonth();

            let count = 0;
            set.forEach(dateStr => {
                const parts = dateStr.split("-");
                if (parseInt(parts[0]) === year && parseInt(parts[1]) === (month + 1)) {
                    count++;
                }
            });
            return count;
        }

        function renderHabitList() {
            const container = document.getElementById("habitListContainer");
            container.innerHTML = "";

            if (!currentUser) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-lock"></i>
                        <p>Bitte melde dich an,<br>um deine Habits zu sehen.</p>
                    </div>
                `;
                return;
            }

            if (habits.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <p>Keine Habits vorhanden.<br>Erstelle jetzt deinen ersten!</p>
                    </div>
                `;
                return;
            }

            const today = getStartOfDay(new Date());

            habits.forEach((habit) => {
                const card = document.createElement("div");
                card.className = "habit-card bouncy";

                card.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    openDetailModal(habit);
                };

                const faIcon = iconMapping[habit.icon] || "fa-star";
                const streak = currentStreak(habit.id);
                const isDoneToday = isCompleted(habit.id, today);

                let weekDotsHTML = "";
                for (let i = 0; i < 7; i++) {
                    const date = new Date();
                    date.setDate(today.getDate() - 6 + i);
                    const dayStart = getStartOfDay(date);
                    const isDone = isCompleted(habit.id, date);
                    const isToday = isSameDay(date, today);
                    const isFuture = dayStart > today;
                    const weekdayIdx = date.getDay();

                    let circleBg = isDone ? habit.colorHex : (isFuture ? "#1E293B" : "#334155");
                    let circleBorder = isFuture ? "1px solid #334155" : "none";
                    let labelColor = isFuture ? "#334155" : (isToday ? habit.colorHex : "#64748B");

                    weekDotsHTML += `
                        <button class="day-col bouncy" onclick="toggleCompletion('${habit.id}', new Date('${date.toISOString()}'))" ${isFuture ? 'disabled' : ''}>
                            <div class="day-circle" style="background-color: ${circleBg}; border: ${circleBorder}"></div>
                            <span class="day-label ${isToday ? 'today' : ''}" style="color: ${labelColor}">${shortWeekdays[weekdayIdx]}</span>
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="habit-icon-box" style="color: ${habit.colorHex}; background-color: ${habit.colorHex}2E">
                        <i class="fa-solid ${faIcon}"></i>
                    </div>
                    <div class="habit-info">
                        <span class="habit-name">${escapeHtml(habit.name)}</span>
                        <div style="display: flex; align-items: center;">
                            <div class="week-row">${weekDotsHTML}</div>
                            ${streak > 0 ? `
                                <div class="streak-badge" style="color: ${habit.colorHex}">
                                    <i class="fa-solid fa-fire"></i>
                                    <span>${streak}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    <button class="check-btn bouncy ${isDoneToday ? 'completed' : ''}" 
                            style="${isDoneToday ? `background-color: ${habit.colorHex}` : ''}"
                            onclick="toggleCompletion('${habit.id}', new Date())">
                        <i class="fa-solid fa-check" style="color: ${isDoneToday ? '#0F172A' : '#475569'}"></i>
                    </button>
                `;

                container.appendChild(card);
            });
        }

        function handleAuthClick() {
            if (currentUser) {
                supabaseClient.auth.signOut();
            } else {
                showAuthError("");
                openModal("authModal");
            }
        }

        function showAuthError(msg) {
            const errBox = document.getElementById("authErrorMsg");
            if (msg) {
                errBox.innerText = msg;
                errBox.style.display = "block";
            } else {
                errBox.style.display = "none";
            }
        }

        async function login() {
            showAuthError("");
            const email = document.getElementById("authEmail").value;
            const password = document.getElementById("authPassword").value;
            
            if (!email || !password) {
                showAuthError("Bitte E-Mail und Passwort eingeben.");
                return;
            }

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                showAuthError(error.message);
            } else {
                closeModal("authModal");
            }
        }

        async function signUp() {
            showAuthError("");
            const email = document.getElementById("authEmail").value;
            const password = document.getElementById("authPassword").value;

            if (!email || !password) {
                showAuthError("Bitte E-Mail und Passwort eingeben.");
                return;
            }

            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                showAuthError(error.message);
            } else {
                alert("Konto erstellt! Du kannst dich jetzt einloggen.");
                closeModal("authModal");
            }
        }

        function setupFormSelectors() {
            const colorGrid = document.getElementById("colorGrid");
            colorGrid.innerHTML = "";
            vibrantPastels.forEach(hex => {
                const circle = document.createElement("div");
                circle.className = `color-circle bouncy ${hex === formColor ? 'selected' : ''}`;
                circle.style.backgroundColor = hex;
                circle.onclick = () => {
                    formColor = hex;
                    document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
                    circle.classList.add('selected');
                };
                colorGrid.appendChild(circle);
            });

            const iconGrid = document.getElementById("iconGrid");
            iconGrid.innerHTML = "";
            availableIcons.forEach(icon => {
                const btn = document.createElement("button");
                btn.className = `icon-btn bouncy ${icon === formIcon ? 'selected' : ''}`;
                const faClass = iconMapping[icon] || "fa-star";
                btn.innerHTML = `<i class="fa-solid ${faClass}"></i>`;
                btn.onclick = () => {
                    formIcon = icon;
                    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                iconGrid.appendChild(btn);
            });
        }

        function openAddModal() {
            if (!currentUser) {
                showAuthError("");
                openModal("authModal");
                return;
            }
            selectedHabitForEdit = null;
            document.getElementById("formModalTitle").innerText = "Neues Habit";
            document.getElementById("habitNameInput").value = "";
            formColor = "#EE8172";
            formIcon = "drop.fill";
            setupFormSelectors();
            openModal("formModal");
        }

        function openEditModal(habit) {
            selectedHabitForEdit = habit;
            document.getElementById("formModalTitle").innerText = "Habit bearbeiten";
            document.getElementById("habitNameInput").value = habit.name;
            formColor = habit.colorHex;
            formIcon = habit.icon;
            setupFormSelectors();
            closeModal("detailModal");
            openModal("formModal");
        }

        async function saveHabitForm() {
            const name = document.getElementById("habitNameInput").value.trim();
            if (!name || !currentUser) return;

            if (selectedHabitForEdit) {
                await supabaseClient
                    .from('habits')
                    .update({ name: name, color_hex: formColor, icon: formIcon })
                    .eq('id', selectedHabitForEdit.id);
            } else {
                await supabaseClient
                    .from('habits')
                    .insert({ name: name, icon: formIcon, color_hex: formColor, user_id: currentUser.id });
            }

            await loadDataFromSupabase();
            closeModal("formModal");
        }

        function openDetailModal(habit) {
            selectedHabitForDetail = habit;
            selectedDetailMonthDate = new Date();
            renderDetailContent();
            openModal("detailModal");
        }

        function renderDetailContent() {
            const habit = selectedHabitForDetail;
            if (!habit) return;

            const content = document.getElementById("detailModalContent");
            const faIcon = iconMapping[habit.icon] || "fa-star";
            const createdDate = new Date(habit.createdAt).toLocaleDateString("de-DE", { month: "short", day: "numeric", year: "numeric" });

            const streak = currentStreak(habit.id);
            const thisMonth = monthCount(habit.id, selectedDetailMonthDate);
            const totalDone = completions[habit.id] ? completions[habit.id].size : 0;

            content.innerHTML = `
                <div class="detail-header-box">
                    <div class="detail-icon-box" style="color: ${habit.colorHex}; background-color: ${habit.colorHex}33">
                        <i class="fa-solid ${faIcon}"></i>
                    </div>
                    <div class="detail-info-text">
                        <h3>${escapeHtml(habit.name)}</h3>
                        <p>Erstellt am ${createdDate}</p>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-box">
                        <i class="fa-solid fa-fire" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${streak}</span>
                        <span class="stat-lbl">Tage Streak</span>
                    </div>
                    <div class="stat-box">
                        <i class="fa-regular fa-calendar" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${thisMonth}</span>
                        <span class="stat-lbl">Diesen Monat</span>
                    </div>
                    <div class="stat-box">
                        <i class="fa-solid fa-certificate" style="color: ${habit.colorHex}"></i>
                        <span class="stat-val">${totalDone}</span>
                        <span class="stat-lbl">Gesamt</span>
                    </div>
                </div>

                <div class="calendar-box">
                    <div class="calendar-nav">
                        <h4>Kalender Übersicht</h4>
                        <div class="calendar-controls">
                            <button onclick="changeDetailMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <span class="month-title">${selectedDetailMonthDate.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</span>
                            <button onclick="changeDetailMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    ${generateCalendarGridHTML(habit, selectedDetailMonthDate)}
                </div>

                <button class="delete-btn-full bouncy" onclick="deleteCurrentHabit()">
                    <i class="fa-solid fa-trash"></i> Habit löschen
                </button>
            `;
        }

        function changeDetailMonth(offset) {
            selectedDetailMonthDate.setMonth(selectedDetailMonthDate.getMonth() + offset);
            renderDetailContent();
        }

        function generateCalendarGridHTML(habit, date) {
            const daysInWeekHeader = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
            let html = `<div class="calendar-grid">`;

            daysInWeekHeader.forEach(d => {
                html += `<div class="weekday-hdr">${d}</div>`;
            });

            const year = date.getFullYear();
            const month = date.getMonth();

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            let firstWeekday = firstDay.getDay() - 1; 
            if (firstWeekday < 0) firstWeekday = 6; 

            for (let i = 0; i < firstWeekday; i++) {
                html += `<div></div>`;
            }

            const today = getStartOfDay(new Date());

            for (let day = 1; day <= lastDay.getDate(); day++) {
                const current = new Date(year, month, day);
                const dayStart = getStartOfDay(current);
                const isDone = isCompleted(habit.id, current);
                const isToday = isSameDay(current, today);
                const isFuture = dayStart > today;

                let bg = isDone ? habit.colorHex : (isToday ? "#334155" : "#0F172A");
                let border = isToday ? `1.5px solid ${habit.colorHex}` : "none";
                let textColor = isFuture ? "#64748B" : (isDone ? "#0F172A" : "#FFFFFF");

                html += `
                    <button class="cal-day-btn bouncy ${isFuture ? 'disabled' : ''}" 
                            style="background-color: ${bg}; border: ${border}; color: ${textColor};"
                            onclick="toggleCompletion('${habit.id}', new Date('${current.toISOString()}'))"
                            ${isFuture ? 'disabled' : ''}>
                        ${day}
                    </button>
                `;
            }

            html += `</div>`;
            return html;
        }

        async function deleteCurrentHabit() {
            if (!selectedHabitForDetail) return;
            if (confirm(`Möchtest du das Habit '${selectedHabitForDetail.name}' wirklich löschen?`)) {
                await supabaseClient
                    .from('habits')
                    .delete()
                    .eq('id', selectedHabitForDetail.id);

                await loadDataFromSupabase();
                closeModal("detailModal");
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.add("active");
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove("active");
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = initApp;
    </script>
</body>
</html>
